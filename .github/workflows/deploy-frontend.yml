name: Deploy Frontend to Production

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'config/**'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: lvzhaobo/mall-admin-web
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=lvzhaobo/mall-admin-web:latest
          cache-to: type=inline
      
      - name: Trigger deployment webhook
        run: |
          curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "service": "mall-admin-web",
              "image": "lvzhaobo/mall-admin-web:latest",
              "token": "${{ secrets.DEPLOY_TOKEN }}"
            }'
      
      - name: Deployment status
        run: |
          echo "✅ Docker image built and pushed successfully"
          echo "✅ Deployment webhook triggered"
          echo "🔗 Image: lvzhaobo/mall-admin-web:latest"
          echo "📝 Commit: ${{ github.sha }}"
